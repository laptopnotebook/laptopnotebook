name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check token secret
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -n "$METRICS_TOKEN" ]; then
            echo "METRICS_TOKEN is present"
          else
            echo "METRICS_TOKEN is EMPTY"
            exit 1
          fi

      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: laptopnotebook
          filename: github-metrics.svg

          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Port_of_Spain
          config_order: base.header, base.activity, base.community, base.repositories, base.metadata
          config_display: regular
          config_padding: 0, 8 + 4%
          config_animations: no

          # test theme will ill change based on how it looks
          extras_css: |
            :root {
              --color-calendar-graph-day-bg: #18151F;
              --color-calendar-graph-day-L1-bg: #302044;
              --color-calendar-graph-day-L2-bg: #633A8B;
              --color-calendar-graph-day-L3-bg: #A855F7;
              --color-calendar-graph-day-L4-bg: #D8B4FE;
            }

            h1, h2, h3 {
              color: #C9A3FF !important;
            }

            a {
              color: #C084FC !important;
            }

          plugin_activity: yes
          plugin_activity_visibility: all
          plugin_activity_days: 14
          plugin_activity_limit: 5
